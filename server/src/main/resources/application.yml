server:
  port: 8080

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}
    textUrl: ${DISCORD_WEBHOOK_URL_TEXT}
  bot:
    token: ${DISCORD_BOT_TOKEN}

admin:
  player-ids: ${ADMIN_PLAYER_IDS}

spring:
  application:
    name: xiangqi-server
  config:
    import: optional:.env.properties
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWK_SET_URI}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/postgres
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#          issuer-uri: ${SUPABASE_ISSUER_URI}

logging:
  level:
    root: WARN
    com.charmflex.xiangqi: INFO


